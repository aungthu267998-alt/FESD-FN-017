<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
          <h3 class="card-title mb-0">Online Course Management - User Registration</h3>
        </div>
        <div class="card-body">

          <!-- Alert Notification -->
          <div *ngIf="alertMessage" [class]="'alert alert-' + alertType + ' alert-dismissible fade show'" role="alert">
            <strong>[{{ httpStatus }}]</strong> {{ alertMessage }}
            <button type="button" class="btn-close" (click)="alertMessage = ''" aria-label="Close"></button>
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" [(ngModel)]="userEmail" name="userEmail" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" [(ngModel)]="userPassword" name="userPassword" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" [(ngModel)]="userFirstName" name="userFirstName" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" [(ngModel)]="userLastName" name="userLastName" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Telephone</label>
                <input type="tel" class="form-control" [(ngModel)]="userTel" name="userTel" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Date of Birth</label>
                <input type="date" class="form-control" [(ngModel)]="dateOfBirth" name="dateOfBirth" required>
              </div>
            </div>

            <div class="mt-4 text-end">
              <button type="submit" class="btn btn-primary px-4">Register User</button>
            </div>
          </form>

        </div>
      </div>

      <!-- User List Table -->
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
          <h4 class="card-title mb-0">Registered User List</h4>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>#</th>
                  <th>Full Name</th>
                  <th>Email</th>
                  <th>Telephone</th>
                  <th>Age</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let user of users; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>{{ user.userFirstName }} {{ user.userLastName }}</td>
                  <td>{{ user.userEmail }}</td>
                  <td>{{ user.userTel }}</td>
                  <td>
                    <span class="badge bg-info text-dark">{{ user.getAge() }} years</span>
                  </td>
                </tr>
                <tr *ngIf="users.length === 0">
                  <td colspan="5" class="text-center text-muted py-3">No registered users found.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
